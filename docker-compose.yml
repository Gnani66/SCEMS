services:

  mosquitto:
    image: eclipse-mosquitto:2

    container_name: scems-mosquitto

    ports:
      - "1883:1883"

    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker/mosquitto/data:/mosquitto/data

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: scems-backend

    ports:
      - "8000:8000"

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_KEEPALIVE: 60
      MQTT_BASE_TOPIC: scems

      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - mosquitto

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend

    container_name: scems-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

    depends_on:
      - backend

    restart: unless-stopped